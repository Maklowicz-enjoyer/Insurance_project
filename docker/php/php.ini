[PHP]
; Security settings
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance settings
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 20M

; Session settings (Redis backend)
; Note: Redis configuration is handled in session_config.php (auto_prepend_file)
; to support dynamic environment variables
auto_prepend_file = /usr/local/etc/php/session_config.php

; Session cookie settings (1 hour = 3600 seconds)
session.cookie_lifetime = 3600
session.gc_maxlifetime = 3600

; OPcache settings
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1

; Timezone
date.timezone = Europe/Warsaw

; File uploads
file_uploads = On
max_file_uploads = 20
